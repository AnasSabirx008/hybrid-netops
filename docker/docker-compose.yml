services:

  router:
    build:
      context: ./router

    container_name: edge-router

    cap_add:
      - NET_ADMIN
      - NET_RAW

    sysctls:
      net.ipv4.ip_forward: "1"

    networks:
      net-admin:
        ipv4_address: 10.20.10.1

      net-servers:
        ipv4_address: 10.20.20.1

    restart: unless-stopped


  admin-client:
    build:
      context: ./admin-client

    container_name: admin-client

    cap_add:
      - NET_ADMIN

    networks:
      net-admin:
        ipv4_address: 10.20.10.10

    depends_on:
      - router

    restart: unless-stopped


  app-server:
    build:
      context: ./app-server

    container_name: app-server

    cap_add:
      - NET_ADMIN

    networks:
      net-servers:
        ipv4_address: 10.20.20.10

    depends_on:
      - router

    restart: unless-stopped


networks:

  net-admin:
    name: hybrid-net-admin
    driver: bridge

    ipam:
      config:
        - subnet: 10.20.10.0/24


  net-servers:
    name: hybrid-net-servers
    driver: bridge

    ipam:
      config:
        - subnet: 10.20.20.0/24
